apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: stage
  labels:
    app: frontend
    env: stage
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
      env: stage
  template:
    metadata:
      labels:
        app: frontend
        env: stage
    spec:
      containers:
        - name: frontend
          image: dasujandb/support-chat-frontend:stage-latest
          imagePullPolicy: Always
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: frontend-service
  namespace: stage
spec:
  type: NodePort
  selector:
    app: frontend
    env: stage
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30012
