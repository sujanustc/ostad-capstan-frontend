apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: support-chat-frontend-dev
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/sujanustc/ostad-capstan-frontend.git'
    targetRevision: dev
    path: k8s/dev
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: dev
  syncPolicy: {}
